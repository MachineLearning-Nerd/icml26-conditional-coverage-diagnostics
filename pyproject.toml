[project]
name = "vaapzm6mkm-repro"
version = "0.2.0"
description = "CPU-only claim-by-claim reproduction of Conditional Coverage Diagnostics for Conformal Prediction (arXiv 2512.11779)"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "torchvision>=0.19",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "numba>=0.60",
    "probmetrics>=1.0.0",
    "pytabkit>=1.5",
    "tabpfn>=2.0",
    "tabicl>=0.1.3",
    "requests>=2.32",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "covmetrics",
    "huggingface-hub",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
covmetrics = { git = "https://github.com/ElSacho/covmetrics.git", rev = "a5205aada6a0f39e3812daf087753217ef66b159" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
